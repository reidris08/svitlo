<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Світло</title>
<meta name="theme-color" content="#F7F1E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Світло">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Палітра «пастельний трекер»: кремовий фон, масло, блакить, рожевий, олива; чорні кнопки-пігулки */
  :root {
    --bg: #F7F1E5; --card: #FFFCF6; --ink: #1D1D1B; --muted: #8C8679; --line: #EDE5D6; --soft: #F3ECDF;
    --on: #F2D872; --on-soft: #FBF0C6; --on-ink: #5E4B0E;        /* світло є — масляно-жовтий */
    --off: #A9C2EA; --off-deep: #7F9FD6; --off-soft: #E3ECFA; --off-ink: #2C4470;  /* немає — блакитний */
    --maybe: #F4B6D6; --maybe-soft: #FCE4F0; --maybe-ink: #7A2E57;  /* перемикання світла */
    --olive: #A4B36C; --olive-soft: #E7ECD3;
    --warn: #F6BCD9; --warn-ink: #3A1328; --accent: #E5484D;
    --shadow: 0 1px 0 rgba(60,45,20,.04), 0 12px 32px -14px rgba(60,45,20,.18);
    --r: 30px;
    --font: "Manrope", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171613; --card: #22211D; --ink: #F5F0E6; --muted: #A39C8E; --line: #34322C; --soft: #2B2924;
      --on: #E9CF68; --on-soft: #3B3420; --on-ink: #F6E3A1;
      --off: #93AEDD; --off-deep: #7896CF; --off-soft: #26303F; --off-ink: #CFDCF5;
      --maybe: #E6A3C6; --maybe-soft: #3D2733; --maybe-ink: #F7CFE3;
      --olive: #9AAA62; --olive-soft: #2D3122;
      --warn: #E6A3C6; --warn-ink: #2A0F1E;
      --shadow: 0 0 0 1px rgba(255,255,255,.035);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.4 var(--font);
    padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .muted { color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card, header, .place-row { animation: rise .45s ease both; }

  /* шапка */
  header { display: flex; align-items: center; gap: 10px; margin: 6px 2px 12px; }
  header .who { flex: 1; min-width: 0; }
  header .eyebrow { font-size: 12px; letter-spacing: .02em; color: var(--muted); font-weight: 600; }
  header h1 { margin: 2px 0 0; font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -.02em; }
  .icon-btn { border: 1.5px dashed color-mix(in srgb, var(--ink) 45%, transparent); background: transparent; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: transform .15s; }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 19px; height: 19px; stroke: var(--ink); }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .place-row { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 16px; padding: 2px 16px 4px; scrollbar-width: none; }
  .place-row::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 16px 10px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; max-width: 82%; }
  .chip span { overflow: hidden; text-overflow: ellipsis; }
  .chip svg { width: 15px; height: 15px; flex: none; stroke: currentColor; opacity: .7; }
  .chip.active { background: var(--ink); color: var(--bg); }
  .chip b { font-weight: 800; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 999px; background: var(--on); color: #1D1D1B; margin-right: -6px; }
  .chip.add { padding: 10px 16px; color: var(--muted); box-shadow: none; border: 1.5px dashed var(--line); background: transparent; }

  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 18px; margin-bottom: 14px; position: relative; overflow: hidden; }

  /* головна картка */
  #now { padding-bottom: 20px; }
  #now > * { position: relative; }
  #now::before { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; opacity: .9; pointer-events: none; transition: background .4s; background: var(--soft); }
  #now.on::before { background: var(--on-soft); } #now.off::before { background: var(--off-soft); } #now.maybe::before { background: var(--maybe-soft); }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; padding: 8px 15px 8px 9px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  .state i { width: 22px; height: 22px; border-radius: 50%; background: var(--muted); display: grid; place-items: center; }
  .state i svg { width: 13px; height: 13px; stroke: #1D1D1B; }
  .state.on i { background: var(--on); } .state.off i { background: var(--off); } .state.maybe i { background: var(--maybe); }
  .big { font-weight: 800; font-size: clamp(50px, 16vw, 64px); line-height: 1; letter-spacing: -.045em; margin: 22px 0 6px; font-variant-numeric: tabular-nums; }
  .big small { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0 12px 0 4px; color: var(--muted); }
  .big.text { font-size: 36px; letter-spacing: -.02em; }
  .lead { font-size: 15.5px; color: var(--muted); }
  .lead b { color: var(--ink); font-weight: 800; }

  /* горизонтальна смуга: товста пігулка з чорним бігунком */
  .barwrap { position: relative; margin-top: 24px; }
  .bar { position: relative; height: 40px; border-radius: 999px; background: var(--soft); }
  .bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; min-width: 40px; border-radius: 999px; background: var(--off); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .bar:not(.on):not(.off):not(.maybe) .fill { display: none; }
  .bar.on .fill { background: var(--on); } .bar.maybe .fill { background: repeating-linear-gradient(135deg, var(--on) 0 8px, var(--off) 8px 16px); }
  .bar .fill::after { content: ""; position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--card); }
  .bar .pct { position: absolute; right: 16px; top: 0; bottom: 0; display: flex; align-items: center; font-weight: 700; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar-ends { display: flex; justify-content: space-between; font-size: 13px; margin-top: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar-ends b { color: var(--ink); font-weight: 800; }

  /* попередження ГАВ / СГАВ — рожева плашка поверх смуги */
  .alert {
    position: absolute; left: -8px; right: -8px; top: 0; height: 50px; z-index: 3;
    display: none; align-items: center; gap: 10px; padding: 0 7px 0 8px;
    background: var(--warn); color: var(--warn-ink); border-radius: 999px;
    font-size: 14px; text-decoration: none; box-shadow: 0 10px 24px -10px rgba(160,60,110,.45);
  }
  .alert.show { display: flex; }
  .alert .txt { flex: 1; min-width: 0; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert b { font-weight: 800; }
  .alert .ic { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--card); color: var(--accent); display: grid; place-items: center; }
  .alert .ic svg { width: 17px; height: 17px; }
  .alert .tm { flex: none; font-size: 12.5px; font-weight: 700; background: var(--ink); color: var(--bg); padding: 9px 13px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .barwrap.alerted { padding-top: 40px; }

  .next { line-height: 1.35; display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px 14px; border-radius: 20px; background: var(--soft); font-size: 14px; }
  .next .dot { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--olive); }
  .next .dot svg { width: 18px; height: 18px; stroke: #1D1D1B; }
  .next b { font-weight: 800; }
  .next:empty { display: none; }

  /* графік на день */
  .dayhead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 14px; }
  .dayhead > div { min-width: 0; }
  .dayhead h2 { margin: 0; font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
  .dayhead .sub { white-space: nowrap; font-size: 13px; color: var(--muted); }
  .dayhead .total { font-size: 12.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); white-space: nowrap; }
  .dayhead .total.zero { background: var(--on); color: #1D1D1B; }
  .day + .day { margin-top: 26px; padding-top: 24px; border-top: 1.5px dashed var(--line); }

  /* огляд доби: широка шкала, яку можна гортати */
  .lanewrap { position: relative; margin: 0 -18px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 34px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 34px), transparent 100%); }
  .lanewrap::-webkit-scrollbar { display: none; }
  .lane { position: relative; height: 146px; margin: 0 18px; }
  .lane .p { position: absolute; top: 34px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--on); color: #1D1D1B; font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; }
  .lane .p.off { background: var(--off); }
  .lane .p.maybe { background: repeating-linear-gradient(135deg, var(--on) 0 5px, var(--off) 5px 10px); }
  .lane .p svg { width: 18px; height: 18px; stroke: #1D1D1B; flex: none; }
  .lane .p.past { opacity: .38; }
  .lane .p .done { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.55) 0 4px, transparent 4px 8px); }
  .lane .hr { position: absolute; top: 30px; height: 60px; width: 1px; background: var(--line); }
  .lane .bt { position: absolute; top: 92px; transform: translateX(-50%); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
  .lane .bt::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1.5px; height: 5px; background: var(--ink); opacity: .5; }
  .lane .bt.low { top: 108px; } .lane .bt.low::before { top: -22px; height: 21px; }
  .lane .hl { position: absolute; top: 128px; transform: translateX(-50%); font-size: 10.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lane .now { position: absolute; top: 26px; height: 68px; width: 4px; margin-left: -2px; border-radius: 4px; background: var(--ink); box-shadow: 0 0 0 2px var(--card); z-index: 2; }
  .lane .nowtag { position: absolute; top: 0; transform: translateX(-50%); font-weight: 800; font-size: 12px; background: var(--ink); color: var(--bg); padding: 4px 10px; border-radius: 999px; white-space: nowrap; z-index: 2; }
  .lanehint { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-top: 2px; text-align: right; }

  /* розклад рядками */
  .agenda { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .agenda li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 20px; background: var(--soft); }
  .agenda .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--on); }
  .agenda .ico svg { width: 19px; height: 19px; stroke: #1D1D1B; }
  .agenda li.off .ico { background: var(--off); }
  .agenda li.maybe .ico, .state.maybe i { background: linear-gradient(135deg, var(--on) 0 50%, var(--off) 50% 100%); }
  .agenda .when { white-space: nowrap; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .agenda .what { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .agenda .len { white-space: nowrap; font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .agenda li.past { opacity: .45; }
  .agenda li.past .when { text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .agenda li.cur { background: var(--ink); color: var(--bg); }
  .agenda li.cur .what, .agenda li.cur .len { color: color-mix(in srgb, var(--bg) 70%, transparent); }
  .agenda .prog { grid-column: 2 / 4; height: 6px; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; margin: 2px 0 4px; }
  .agenda .prog i { display: block; height: 100%; border-radius: 6px; background: var(--on); }
  .agenda li.off .prog i { background: var(--off); } .agenda li.maybe .prog i { background: linear-gradient(90deg, var(--on), var(--off)); }
  .agenda li.pastsum { display: block; padding: 0; background: none; }
  .agenda li.pastsum summary { list-style: none; cursor: pointer; padding: 11px 16px; border-radius: 999px; border: 1.5px dashed var(--line); font-size: 13.5px; font-weight: 700; color: var(--muted); }
  .agenda li.pastsum summary::-webkit-details-marker { display: none; }
  .agenda li.pastsum summary::after { content: " ›"; } .agenda li.pastsum details[open] summary::after { content: " ⌄"; }
  .agenda li.pastsum .agenda { margin-top: 6px; }
  .legend { display: flex; gap: 16px; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 4px 8px 0; }
  .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--on); }
  .legend .o::before { background: var(--off); } .legend .m::before { background: linear-gradient(135deg, var(--on) 0 50%, var(--off) 50% 100%); }

  footer { font-size: 12px; text-align: center; margin-top: 22px; line-height: 1.7; color: var(--muted); }
  footer a { color: inherit; }
  .stale { color: var(--accent); font-weight: 700; }
  .empty { text-align: center; padding: 26px 10px; color: var(--muted); }
  .empty .em { font-size: 30px; display: block; margin-bottom: 6px; }

  /* налаштування адреси */
  dialog { border: 0; padding: 0; width: min(520px, 100%); max-height: 94vh; margin: auto auto 0; border-radius: 32px 32px 0 0; background: var(--card); color: var(--ink); }
  dialog[open] { animation: up .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (min-width: 560px) { dialog { margin: auto; border-radius: 32px; } }
  dialog::backdrop { background: rgba(30,28,22,.35); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .sheet { padding: 10px 20px max(22px, env(safe-area-inset-bottom)); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 4px; font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
  label.f { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 20px 0 8px; }
  .inp { position: relative; }
  .inp svg { position: absolute; left: 16px; top: 16px; width: 18px; height: 18px; stroke: var(--muted); }
  input[type=text] { width: 100%; border: 2px solid transparent; background: var(--soft); color: var(--ink); border-radius: 999px; padding: 14px 16px 14px 44px; font: inherit; font-size: 16px; outline: none; transition: border-color .2s; }
  input[type=text]:focus { border-color: var(--ink); }
  .hint { font-size: 12.5px; margin: 8px 6px 0; color: var(--muted); }
  .results { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 38vh; overflow-y: auto; }
  .results li { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 22px; background: var(--soft); cursor: pointer; border: 2px solid transparent; transition: border-color .15s; }
  .results li.sel { border-color: var(--ink); }
  .results .qb { flex: none; min-width: 50px; text-align: center; font-weight: 800; font-size: 17px; padding: 8px 0; border-radius: 16px; background: var(--off); color: #1D1D1B; }
  .results .qb small { display: block; font-size: 10px; font-weight: 700; opacity: .7; }
  .results .sn { font-size: 13px; line-height: 1.4; color: var(--muted); }
  .results .sn mark { background: var(--on); color: #1D1D1B; border-radius: 5px; padding: 0 2px; margin: 0 -1px; font-weight: 700; }
  .results .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-bottom: 4px; background: var(--olive-soft); color: var(--ink); }
  .results .tag.w { background: var(--maybe-soft); color: var(--maybe-ink); }
  .found { display: none; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 16px 10px 10px; border-radius: 999px; background: var(--on); color: #1D1D1B; font-size: 14px; font-weight: 600; }
  .found.show { display: flex; }
  .found > span:first-child { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--on); display: grid; place-items: center; font-weight: 800; }
  .found b { font-weight: 800; font-size: 18px; }
  details.manual { margin-top: 16px; }
  details.manual summary { font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; list-style: none; }
  details.manual summary::-webkit-details-marker { display: none; }
  details.manual summary::after { content: " ›"; }
  details[open].manual summary::after { content: " ⌄"; }
  .qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .qgrid button { border: 0; background: var(--soft); border-radius: 999px; padding: 12px 0; font-weight: 800; font-size: 16px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .qgrid button.sel { background: var(--ink); color: var(--bg); }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .primary, .secondary { flex: 1; border: 0; border-radius: 999px; padding: 16px; font-weight: 800; cursor: pointer; }
  .primary { background: var(--ink); color: var(--bg); }
  .primary:disabled { opacity: .3; }
  .secondary { background: var(--soft); }
  .danger { display: block; margin: 16px auto 0; background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="who">
    <div class="eyebrow">Полтаваобленерго</div>
    <h1 id="title">Світло</h1>
  </div>
  <button class="icon-btn" id="refreshBtn" aria-label="Оновити">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
</header>

<div class="place-row" id="places"></div>

<section class="card" id="now">
  <span class="state" id="state"><i id="stateIco"></i><span id="stateText">…</span></span>
  <div class="big" id="big">—</div>
  <div class="lead" id="lead">Завантаження графіка…</div>
  <div class="barwrap" id="barwrap">
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="bar-ends"><span id="barFrom"></span><span id="barTo"></span></div>
    <a class="alert" id="alert" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6"/><path d="M12 17h.01"/></svg></span>
      <span class="txt"><b id="alertTitle">Діють ГАВ</b><br><span style="font-size:12.5px">графік може не діяти</span></span>
      <span class="tm" id="alertTime"></span>
    </a>
  </div>
  <div class="next" id="next"></div>
</section>

<section class="card" id="days"></section>
<div class="legend"><span>світло є</span><span class="o">немає</span><span class="m">перемикання</span></div>

<footer id="footer"></footer>

<dialog id="dlg">
  <form class="sheet" method="dialog" id="form">
    <div class="grab"></div>
    <h3 id="dlgTitle">Ваша адреса</h3>
    <div class="muted" style="font-size:14px">Черга визначиться автоматично. Адреса зберігається лише на цьому телефоні.</div>

    <label class="f" for="addrInput">Адреса</label>
    <div class="inp">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <input type="text" id="addrInput" placeholder="Полтава, Соборності 12" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="hint" id="addrHint">Формат: місто, вулиця, будинок</div>
    <div class="found" id="found"><span>✓</span><span>Ваша черга <b id="foundQ"></b><br><span style="font-size:12.5px;opacity:.85" id="foundNote"></span></span></div>
    <ul class="results" id="results"></ul>

    <details class="manual" id="manual">
      <summary>Обрати чергу вручну</summary>
      <div class="qgrid" id="qgrid"></div>
    </details>

    <div class="actions">
      <button class="secondary" value="cancel" formnovalidate>Скасувати</button>
      <button class="primary" value="save" id="saveBtn" disabled>Зберегти</button>
    </div>
    <button type="button" class="danger" id="deleteBtn">Видалити цю адресу</button>
  </form>
</dialog>

<script src="poe.js?v=10"></script>
<script src="search.js?v=10"></script>
<script>
"use strict";
const QUEUES = ["1.1","1.2","2.1","2.2","3.1","3.2","4.1","4.2","5.1","5.2","6.1","6.2"];
const LS = { places: "svitlo.places", active: "svitlo.active", cache: "svitlo.cache" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

/* ---------- адреси (зберігаються лише на телефоні) ---------- */
let places = load(LS.places, []);
let activeId = load(LS.active, places[0]?.id ?? null);
const active = () => places.find((p) => p.id === activeId) || places[0] || null;

/* ---------- дані ---------- */
let { schedule = null, status = null, unloading = null } = load(LS.cache, {});
let addresses = null;

async function fetchJSON(url) {
  const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function refresh() {
  $("refreshBtn").classList.add("spin");
  // графік — напряму з сайту обленерго (свіжий, одразу з «завтра»);
  // якщо сайт недоступний — копія, яку збирає GitHub
  const [live, s, st, un] = await Promise.allSettled([POE.fetchDays(), fetchJSON("data/schedule.json"), fetchJSON("data/status.json"), POE.fetchUnloading()]);
  if (un.status === "fulfilled") unloading = un.value;
  if (live.status === "fulfilled" && live.value.length) schedule = { checkedAt: new Date().toISOString(), source: "poe.pl.ua", days: live.value };
  else if (s.status === "fulfilled") schedule = s.value;
  if (st.status === "fulfilled") status = st.value;
  save(LS.cache, { schedule, status, unloading });
  setTimeout(() => $("refreshBtn").classList.remove("spin"), 300);
  render();
}
async function loadAddresses() {
  if (addresses) return addresses;
  try { addresses = (await (await fetch("data/addresses.json")).json()); } catch { addresses = { rows: [] }; }
  return addresses;
}

/* ---------- час ---------- */
const hm = (d) => d.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
function durParts(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 1) return ["<1", "хв"];
  const h = Math.floor(m / 60), mm = m % 60;
  return !h ? [mm, "хв"] : mm ? [h, "год", mm, "хв"] : [h, "год"];
}
const durText = (ms) => durParts(ms).join(" ").replace(/(\d) (год|хв)/g, "$1 $2");
const slotStart = (date, i) => { const [y, m, d] = date.split("-").map(Number); return new Date(y, m - 1, d, 0, 30 * i); };
function dayLabel(date) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = slotStart(date, 0), diff = Math.round((d - today) / 864e5);
  const txt = d.toLocaleDateString("uk-UA", { weekday: "long", day: "numeric", month: "long" });
  return diff === 0 ? ["Сьогодні", txt] : diff === 1 ? ["Завтра", txt] : [txt[0].toUpperCase() + txt.slice(1), ""];
}
function segments(queue) {
  const segs = [];
  for (const day of schedule?.days || []) {
    const s = day.slots[queue]; if (!s) continue;
    for (let i = 0; i < 48; i++) {
      const v = s[i] === "0" ? "off" : s[i] === "?" ? "maybe" : "on";
      const start = slotStart(day.date, i), end = slotStart(day.date, i + 1), last = segs.at(-1);
      if (last && last.v === v && +last.end === +start) last.end = end; else segs.push({ v, start, end });
    }
  }
  return segs;
}

/* ---------- головна картка ---------- */
// Іконки: лампочка (світло є), перекреслена блискавка (немає),
// «перемикання світла» — діагональні половинки цих двох знаків
const BULB = '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>';
const ZAPOFF = '<path d="M12.4 6.7 13 2l-2.4 2.9"/><path d="M18.6 12.9 21 10h-5.3"/><path d="M8 8l-5 6h9l-1 8 5-6"/><path d="M3 3l18 18"/>';
const SVG = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICO = {
  on: SVG(BULB),
  off: SVG(ZAPOFF),
  maybe: SVG(`<g transform="translate(0.5 0.5) scale(.52)" stroke-width="3.6">${BULB}</g><g transform="translate(11 11) scale(.52)" stroke-width="3.6">${ZAPOFF}</g><path d="M21.5 2.5 2.5 21.5" stroke-width="1.4" opacity=".55"/>`),
};
const STATE = { on: "Світло є", off: "Світла немає", maybe: "Перемикання світла" };
const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
function renderNow(place) {
  const now = new Date(), segs = segments(place.queue);
  const i = segs.findIndex((s) => s.start <= now && now < s.end);
  const card = $("now"), bar = $("bar");
  if (i < 0) {
    card.className = "card"; $("state").className = "state"; $("stateText").textContent = "Немає даних";
    $("big").className = "big text"; $("big").textContent = schedule ? "Графік очікується" : "Немає зв'язку";
    $("lead").textContent = schedule ? "Обленерго ще не опублікувало графік на сьогодні" : "Не вдалося завантажити графік";
    bar.className = "bar"; $("fill").style.width = "0";
    $("barFrom").textContent = $("barTo").textContent = ""; $("next").innerHTML = "";
    return;
  }
  const cur = segs[i], next = segs[i + 1], lastOn = cur.v === "on" && !next;
  card.className = "card " + cur.v;
  $("state").className = "state " + cur.v; $("stateText").textContent = STATE[cur.v]; $("stateIco").innerHTML = ICO[cur.v];
  if (lastOn) {
    $("big").className = "big text"; $("big").textContent = "Без відключень";
    $("lead").textContent = "За графіком до кінця опублікованих даних";
  } else {
    $("big").className = "big";
    $("big").innerHTML = durParts(cur.end - now).map((p, k) => (k % 2 ? `<small>${p}</small>` : p)).join("");
    const what = cur.v === "on" ? (next.v === "maybe" ? "до перемикання світла" : "до вимкнення")
               : cur.v === "off" ? (next?.v === "maybe" ? "до перемикання світла" : "до ввімкнення")
               : (next?.v === "on" ? "до ввімкнення" : "до вимкнення");
    $("lead").innerHTML = `${what} о <b>${hm(cur.end)}</b>`;
  }
  const p = Math.min(1, Math.max(0, (now - cur.start) / (cur.end - cur.start)));
  bar.className = "bar " + cur.v;
  $("fill").style.width = Math.max(7, p * 100).toFixed(2) + "%";
  
  $("barFrom").innerHTML = `${cur.v === "off" ? "вимкнули" : cur.v === "on" ? "світло з" : "з"} <b>${hm(cur.start)}</b>`;
  $("barTo").innerHTML = lastOn ? "" : `${cur.v === "off" ? "ввімкнуть" : "вимкнуть"} <b>${hm(cur.end)}</b>`;

  // що далі
  let nx = "";
  if (cur.v === "on") {
    const off = segs.slice(i + 1).find((s) => s.v !== "on");
    if (off) nx = `Далі ${off.v === "maybe" ? "перемикання світла" : "без світла"} <b>${hm(off.start)}–${hm(off.end)}</b> · ${durText(off.end - off.start)}`;
  } else {
    const on = segs.slice(i + 1).find((s) => s.v === "on");
    const off2 = on && segs.slice(segs.indexOf(on) + 1).find((s) => s.v !== "on");
    if (on) nx = off2 ? `Після ввімкнення світло буде до <b>${hm(off2.start)}</b> · ${durText(off2.start - on.start)}` : `Після ввімкнення відключень за графіком більше немає`;
  }
  $("next").innerHTML = nx ? `<span class="dot">${ICON_CLOCK}</span><span>${nx}</span>` : "";
}

function renderAlert() {
  const e = POE.emergencyNow(unloading, status?.emergency), on = !!e;
  $("alert").classList.toggle("show", on);
  $("barwrap").classList.toggle("alerted", on);
  if (!on) return;
  $("alertTitle").textContent = (e.type === "СГАВ" ? "Діють СГАВ" : "Діють ГАВ") + (e.from ? ` з ${hm(e.from)}` : "");
  $("alertTime").textContent = "Деталі ›";
  $("alert").href = e.link || "https://t.me/poltavaOE";
  $("alert").title = e.text || "";
}

/* ---------- графік на дні ---------- */
function renderDays(place) {
  const box = $("days"), now = new Date();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const shown = (schedule?.days || []).filter((d) => d.slots[place.queue] && slotStart(d.date, 48) > today).slice(0, 2);
  if (!shown.length) { box.innerHTML = `<div class="empty"><span class="em">🗓</span>Графік ще не опубліковано</div>`; return; }
  const WHAT = { on: "світло є", off: "без світла", maybe: "перемикання світла" };
  box.innerHTML = shown.map((d) => {
    const s = d.slots[place.queue], [title, sub] = dayLabel(d.date);
    // періоди доби (і зі світлом, і без)
    const runs = [];
    for (let i = 0; i < 48;) {
      const k = s[i]; let j = i; while (j < 48 && s[j] === k) j++;
      runs.push({ v: k === "0" ? "off" : k === "?" ? "maybe" : "on", a: slotStart(d.date, i), b: slotStart(d.date, j), n: j - i, end24: j === 48 });
      i = j;
    }
    const offMin = runs.filter((r) => r.v === "off").reduce((t, r) => t + (r.b - r.a) / 60000, 0);
    const isToday = runs.some((r) => r.a <= now && now < r.b);
    // широка шкала: 72 px на годину; підписи часу на кожній межі періоду
    const H = 72, X = (t) => ((t - runs[0].a) / 3600e3 * H);
    let lane = "";
    for (let h = 0; h <= 24; h++) lane += `<span class="hr" style="left:${h * H}px"></span><span class="hl" style="left:${h * H}px">${String(h).padStart(2, "0")}:00</span>`;
    const bounds = new Set();
    for (const r of runs) {
      const past = r.b <= now, cur = r.a <= now && now < r.b;
      const x = X(r.a), w = X(r.b) - x;
      const p = cur ? (now - r.a) / (r.b - r.a) * 100 : 0;
      const inner = w >= 150 ? `${ICO[r.v]}<span>${hm(r.a)}–${r.end24 ? "24:00" : hm(r.b)}</span>` : w >= 40 ? ICO[r.v] : "";
      lane += `<div class="p ${r.v} ${past ? "past" : ""}" style="left:${x + 2}px;width:${w - 4}px">${cur ? `<span class="done" style="width:${p.toFixed(1)}%"></span>` : ""}${inner}</div>`;
      if (r.v !== "on" || true) { bounds.add(+r.a); bounds.add(+r.b); }
    }
    // підписи меж (без 00:00 і 24:00 — вони є в годинній шкалі)
    // якщо дві межі поруч (півгодини), другий підпис опускаємо нижче, щоб не налазили
    let lastX = -999, low = false;
    for (const t of [...bounds].sort((a, b) => a - b)) {
      const d0 = new Date(t);
      if (+d0 === +runs[0].a || +d0 === +runs[runs.length - 1].b) continue;
      const x = X(d0); low = x - lastX < 46 ? !low : false; lastX = x;
      lane += `<span class="bt ${low ? "low" : ""}" style="left:${x}px">${hm(d0)}</span>`;
    }
    if (isToday) lane += `<span class="now" style="left:${X(now)}px"></span><span class="nowtag" style="left:${X(now)}px">${hm(now)}</span>`;
    const rowOf = (r) => {
      const past = r.b <= now, cur = r.a <= now && now < r.b;
      const prog = cur ? `<span class="prog"><i style="width:${((now - r.a) / (r.b - r.a) * 100).toFixed(1)}%"></i></span>` : "";
      const label = cur ? (r.v === "off" ? `зараз без світла · ще ${durText(r.b - now)}` : r.v === "on" ? `зараз світло є · ще ${durText(r.b - now)}` : `зараз перемикання світла · ще ${durText(r.b - now)}`) : WHAT[r.v];
      return `<li class="${r.v} ${past ? "past" : ""} ${cur ? "cur" : ""}"><span class="ico">${ICO[r.v]}</span><span><div class="when">${hm(r.a)} – ${r.end24 ? "24:00" : hm(r.b)}</div><div class="what">${label}</div></span><span class="len">${durText(r.b - r.a)}</span>${prog}</li>`;
    };
    // те, що вже минуло, згортаємо в один рядок
    const pastRuns = runs.filter((r) => r.b <= now), rest = runs.filter((r) => r.b > now);
    const rows = (pastRuns.length ? `<li class="pastsum"><details><summary>Уже минуло · ${pastRuns.length} ${pastRuns.length < 5 ? "періоди" : "періодів"}</summary><ul class="agenda">${pastRuns.map(rowOf).join("")}</ul></details></li>` : "") + rest.map(rowOf).join("");
    const total = offMin ? `без світла ${durText(offMin * 60000)}` : "без відключень";
    return `<div class="day">
      <div class="dayhead"><div><h2>${title}</h2><div class="sub">${sub}</div></div><span class="total ${offMin ? "" : "zero"}">${total}</span></div>
      <div class="lanewrap" data-day="${d.date}" data-now="${isToday ? X(now) : -1}"><div class="lane" style="width:${24 * H}px">${lane}</div></div>
      <div class="lanehint">гортайте шкалу ⟷</div>
      <ul class="agenda">${rows}</ul>
    </div>`;
  }).join("");
}

const laneScroll = {};   // { дата: { left, at } } — куди людина прогорнула шкалу
function setupLanes() {
  for (const el of document.querySelectorAll(".lanewrap")) {
    const k = el.dataset.day, st = laneScroll[k], nowX = +el.dataset.now;
    if (st && Date.now() - st.at < 2 * 60 * 1000) el.scrollLeft = st.left;          // нещодавно гортали — лишаємо як є
    else el.scrollLeft = nowX >= 0 ? Math.max(0, nowX - 40) : 0;                     // інакше — з поточного часу
    const auto = el.scrollLeft;
    el.onscroll = () => { if (Math.abs(el.scrollLeft - auto) > 2) laneScroll[k] = { left: el.scrollLeft, at: Date.now() }; };
  }
}

function renderFooter() {
  const t = schedule?.checkedAt ? new Date(schedule.checkedAt) : null;
  const stale = t && Date.now() - t > 3 * 3600e3;
  $("footer").innerHTML =
    (t ? `<span class="${stale ? "stale" : ""}">Перевірено ${t.toLocaleString("uk-UA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}${stale ? " — дані можуть бути застарілими" : ""}</span><br>` : "") +
    `Джерела: <a href="https://www.poe.pl.ua/disconnection/power-outages/" target="_blank" rel="noopener">poe.pl.ua</a> · <a href="https://t.me/poltavaOE" target="_blank" rel="noopener">Telegram POE</a><br>Неофіційний застосунок · офіційні повідомлення мають пріоритет`;
}

const shortAddr = (a) => (a || "Моя адреса").replace(/^(м\.|місто)\s*/i, "");
function renderPlaces() {
  const a = active();
  $("places").innerHTML = places.map((p) =>
    `<button class="chip ${p.id === a?.id ? "active" : ""}" data-id="${p.id}">${PIN}<span>${esc(shortAddr(p.address))}</span><b>${p.queue}</b></button>`).join("")
    + `<button class="chip add" data-id="new">+ адреса</button>`;
}

function render() {
  const place = active();
  renderPlaces(); renderAlert(); renderFooter();
  if (!place) {
    $("title").textContent = "Світло";
    $("now").className = "card"; $("state").className = "state"; $("stateText").textContent = "Адресу не вказано";
    $("big").className = "big text"; $("big").textContent = "Додайте адресу";
    $("lead").textContent = "Натисніть «+ адреса» — черга визначиться сама";
    $("days").innerHTML = ""; $("next").innerHTML = "";
    return;
  }
  $("title").textContent = `Черга ${place.queue}`;
  renderNow(place); renderDays(place); setupLanes();
}

/* ---------- діалог адреси з автопошуком черги ---------- */
let editing = null, selQueue = null, lastResults = [], manualPick = false;
$("qgrid").innerHTML = QUEUES.map((q) => `<button type="button" data-q="${q}">${q}</button>`).join("");
function choose(q, note) {
  selQueue = q;
  for (const b of $("qgrid").children) b.classList.toggle("sel", b.dataset.q === q);
  $("found").classList.toggle("show", !!q);
  $("foundQ").textContent = q || "";
  $("foundNote").textContent = note || "";
  $("saveBtn").disabled = !q;
}
$("qgrid").onclick = (e) => { const q = e.target.dataset?.q; if (q) { manualPick = true; choose(q, "обрано вручну"); markResults(); } };

function markResults() { [...$("results").children].forEach((li) => li.classList.toggle("sel", li.dataset.q === selQueue)); }
async function runSearch() {
  const text = $("addrInput").value.trim();
  if (text.length < 3) { $("results").innerHTML = ""; $("addrHint").textContent = "Формат: місто, вулиця, будинок"; return; }
  const data = await loadAddresses();
  const { query, results } = AddrSearch.search(data.rows, text, 8);
  lastResults = results;
  const auto = AddrSearch.decide(results);
  // автоматичний вибір оновлюється з кожною зміною адреси; вибір, зроблений вручну, не чіпаємо
  if (!manualPick) choose(auto, auto ? (results[0].kind === "house" ? `будинок ${query.house} є у переліку` : "вулиця у переліку повністю") : "");
  const NOTE = " Перелік обленерго неповний — якщо знаєте свою чергу, оберіть її вручну.";
  if (!results.length) {
    $("addrHint").textContent = data.rows.length ? "Цієї адреси немає в переліку обленерго." + NOTE : "Перелік адрес ще не завантажено — оберіть чергу вручну";
    $("manual").open = true;
  } else if (auto) {
    $("addrHint").textContent = "Знайдено в переліку обленерго. Якщо черга інша — оберіть вручну нижче.";
  } else {
    $("addrHint").textContent = (results[0].approx || results[0].score < 3 ? `Будинку ${query.house || ""} немає в переліку — схожі записи нижче.` : "Адреса є в кількох місцях — оберіть свій варіант.") + NOTE;
    $("manual").open = true;
  }
  // показуємо до 5 найкращих збігів з фрагментом тексту з PDF
  const seen = new Set();
  const minScore = auto ? results[0].score - 1.5 : -Infinity;   // коли черга однозначна — без слабких збігів
  $("results").innerHTML = results.filter((r) => r.score >= minScore).filter((r) => { const k = r.q + r.t.slice(r.at - 20, r.at + 40); if (seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, 5).map((r) => {
      const s = AddrSearch.snippet(r, 50, 110);
      const tag = r.score < 3 ? `<span class="tag w">схожий запис — перевірте</span>` : r.kind === "house" ? `<span class="tag">будинок у списку</span>` : r.kind === "whole" ? `<span class="tag">уся вулиця</span>` : `<span class="tag w">вулиця, номер не вказано</span>`;
      return `<li data-q="${r.q}"><span class="qb">${r.q}<small>черга</small></span><span class="sn">${tag}<br>${esc(s.pre)}<mark>${esc(s.hit)}</mark>${esc(s.post)}</span></li>`;
    }).join("");
  markResults();
}
let searchTimer;
$("addrInput").oninput = () => { if (!editing) manualPick = false; clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 250); };
$("results").onclick = (e) => { const li = e.target.closest("li"); if (li) { manualPick = true; choose(li.dataset.q, "обрано зі списку"); markResults(); } };

function openDialog(place) {
  editing = place; manualPick = !!place;
  $("dlgTitle").textContent = place ? "Змінити адресу" : "Ваша адреса";
  $("addrInput").value = place?.address || "";
  $("results").innerHTML = ""; $("addrHint").textContent = "Формат: місто, вулиця, будинок";
  choose(place?.queue || null, place ? "збережена черга" : "");
  $("manual").open = false;
  $("deleteBtn").style.display = place ? "" : "none";
  $("dlg").showModal();
  loadAddresses();
  if (place?.address) runSearch().then(markResults);
}
$("form").addEventListener("submit", (e) => {
  if (e.submitter?.value !== "save" || !selQueue) return;
  const address = $("addrInput").value.trim();
  if (editing) Object.assign(editing, { address, queue: selQueue });
  else { const p = { id: Date.now().toString(36), address, queue: selQueue }; places.push(p); activeId = p.id; }
  save(LS.places, places); save(LS.active, activeId);
  render();
});
$("deleteBtn").onclick = () => {
  places = places.filter((p) => p !== editing); activeId = places[0]?.id ?? null;
  save(LS.places, places); save(LS.active, activeId); $("dlg").close(); render();
};
$("refreshBtn").onclick = refresh;
$("places").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.id === "new") return openDialog(null);
  if (b.dataset.id === active()?.id) return openDialog(active());   // повторне натискання — редагування
  activeId = b.dataset.id; save(LS.active, activeId); render();
};

/* ---------- старт ---------- */
render(); refresh();
if (!places.length) setTimeout(() => openDialog(null), 450);
setInterval(render, 30 * 1000);
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
