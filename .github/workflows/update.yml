name: Оновлення графіка

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні 10 хв (GitHub інколи запускає із затримкою)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Зберегти зміни
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "svitlo-bot"
            git config user.email "svitlo-bot@users.noreply.github.com"
            git add data
            git commit -m "Оновлення даних $(TZ=Europe/Kyiv date '+%d.%m %H:%M')"
            git push
          else
            echo "Змін немає"
          fi
